apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage
  namespace: garage
spec:
  refreshInterval: "30m"
  secretStoreRef:
    name: global-secret-store
    kind: ClusterSecretStore
  target:
    name: garage
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: garage
