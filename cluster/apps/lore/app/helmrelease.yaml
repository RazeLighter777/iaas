# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lore
  namespace: lore
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      lore:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          mirror:
            image:
              repository: ghcr.io/razelighter777/iaas/lore-mirror
              tag: 0.0.20
            env:
              - name: TZ
                value: ${timezone}
              - name: URL_BASE
                value: https://lore.${domain_name}
              - name: LISTS
                value: >-
                  lkml netdev linux-mm linux-fsdevel bpf linux-security-module
                  stable kvm linux-block io-uring linux-arm-kernel dri-devel
                  linux-ext4 linux-btrfs linux-xfs linux-crypto linux-pci
                  linux-usb linux-wireless
              - name: REFRESH_SECONDS
                value: "300"
              # jobs must be shards+1 (inboxes have 3 Xapian shards) or
              # public-inbox-index warns and bumps it internally
              - name: INDEX_JOBS
                value: "4"
              - name: INDEX_LEVEL
                value: full
              - name: INDEX_BATCH_SIZE
                value: 100m
              - name: INDEX_PARALLEL
                value: "3"
              # cross-list "all" search index, like lore.kernel.org's
              - name: EXTINDEX_JOBS
                value: "9"
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                cpu: "24"
                memory: 48Gi
          httpd:
            image:
              repository: ghcr.io/razelighter777/iaas/lore-mirror
              tag: 0.0.20
            command:
              - /usr/bin/tini
              - --
              - /usr/local/bin/httpd.sh
            env:
              - name: TZ
                value: ${timezone}
              - name: LISTEN
                value: 0.0.0.0:8080
              - name: HTTPD_WORKERS
                value: "4"
            # No readiness probe: httpd can't listen until the initial multi-hour
            # mirror+index completes, and an unready pod would wedge the helm
            # install (and with it the flux apps dependency chain).
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 2Gi
    service:
      app:
        controller: lore
        ports:
          http:
            port: 80
            targetPort: 8080
    ingress:
      app:
        enabled: false
    persistence:
      data:
        enabled: true
        existingClaim: lore
        globalMounts:
          - path: /data
