# grokmirror 2.x configuration mirroring only lkml from lore.kernel.org,
# using lore's per-list manifest (contains only the lkml epochs).
[core]
toplevel = /data/git
manifest = ${toplevel}/manifest.js.gz
log = ${toplevel}/grokmirror.log
loglevel = info

[remote]
site = https://lore.kernel.org
manifest = ${site}/lkml/manifest.js.gz

[pull]
projectslist = ${core:toplevel}/projects.list
pull_threads = 4
include = /lkml/git/*

[fsck]
frequency = 30
report_to = stdout
statusfile = ${core:toplevel}/fsck.status.js
repair = yes
